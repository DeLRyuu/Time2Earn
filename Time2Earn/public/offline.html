<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#080b11" />
    <title>Time2Earn — Offline</title>
    <style>
      :root {
        --bg-color: #080b11;
        --card-bg: #121826;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-color: #f1f5f9;
        --text-muted: #94a3b8;
        --color-primary: #00ffcc;
        --color-arcade: #a855f7;
        --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .offline-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2.5rem 1.75rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .offline-icon {
        font-size: 3.5rem;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        color: var(--color-primary);
        text-transform: uppercase;
      }
      p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .badge {
        display: inline-block;
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(168, 85, 247, 0.15);
        border: 1px solid var(--color-arcade);
        color: var(--color-arcade);
      }
      .btn {
        background: var(--color-primary);
        color: #000000;
        border: none;
        border-radius: 8px;
        padding: 0.85rem 1.75rem;
        font-size: 0.95rem;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="offline-icon" aria-hidden="true">📡</div>
      <div class="badge">App Shell Active</div>
      <h1>Offline Mode</h1>
      <p>
        You are currently disconnected. The Time2Earn shell is cached, but a network connection is required to authenticate, load fresh credit balances, and claim rewards.
      </p>
      <button class="btn" onclick="checkConnection()">Retry Connection</button>
    </main>

    <script>
      function checkConnection() {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          alert('Still offline. Please check your shop Wi-Fi or data connection.');
        }
      }
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
